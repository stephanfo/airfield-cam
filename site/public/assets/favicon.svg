<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="t">
  <title id="t">Airfield Cam</title>
  <!--
    La caméra seule, sans la piste ni le ciel du logo complet (tools/logo.svg) : à 16 px,
    le dégradé et les marquages d'axe se réduisent à une bouillie, alors que la silhouette
    « corps + pare-soleil + objectif » reste identifiable.

    Couleurs : THEME_COLOR (#045BCB) et THEME_ACCENT (#AECD47) de config.example.php, comme
    tout le reste des assets régénérés par tools/generate-assets.php.
  -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#045BCB"/>

  <!-- Corps de la caméra -->
  <rect x="10" y="20" width="30" height="24" rx="6" fill="#ffffff"/>
  <!-- Pare-soleil -->
  <path d="M40 25 L53 20 A2 2 0 0 1 56 22 V42 A2 2 0 0 1 53 44 L40 39 Z" fill="#cfe1fb"/>
  <!-- Objectif -->
  <circle cx="22" cy="32" r="8.5" fill="#0a3f8f"/>
  <circle cx="22" cy="32" r="5" fill="#045BCB"/>
  <circle cx="20" cy="30" r="2" fill="#ffffff" opacity=".85"/>
  <!-- Témoin d'enregistrement -->
  <circle cx="34" cy="26" r="2.6" fill="#AECD47"/>
</svg>
