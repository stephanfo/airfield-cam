name: Site & documentation

# Publie la vitrine et la documentation sur GitHub Pages (https://airfield-cam.ratelet.fr).
#
# Ce workflow est la seule automatisation du dépôt : l'application, elle, n'a ni build ni suite
# de tests (cf. CONTRIBUTING.md). Sa porte de qualité lui est propre — le build VitePress échoue
# sur lien mort (`ignoreDeadLinks` laissé à false), et site/build-local.sh vérifie ensuite que
# rien ne manque à l'arrivée.
#
# L'assemblage n'est pas réécrit ici : le job appelle site/build-local.sh, le même script que
# celui utilisé en local. C'est ce qui garantit que « ça marche chez moi » vaut aussi en CI.

on:
  push:
    branches: [main]
    paths:
      - 'doc/**'
      - 'site/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'og-image.jpg'          # copiée dans le site comme image de partage
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'doc/**'
      - 'site/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Un groupe PAR RÉFÉRENCE, et non un groupe « pages » global : GitHub ne garde qu'un run en
  # attente par groupe, donc un groupe unique ferait évincer le build d'une PR par celui d'une
  # autre — la vérification des liens ne tournerait alors jamais sur la PR évincée. Les
  # déploiements, eux, ne partent que de main : ils restent sérialisés entre eux.
  group: pages-${{ github.ref }}
  # Annuler un déploiement Pages en vol peut laisser le site dans un état incohérent :
  # mieux vaut laisser finir.
  cancel-in-progress: false

jobs:
  build:
    name: Construire le site
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # `lastUpdated` lit la date du dernier commit de chaque page : sans l'historique
          # complet, toutes les pages porteraient la date du checkout.
          fetch-depth: 0

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          # npm ne vit que sous site/ : le lockfile à mettre en cache est le sien.
          cache-dependency-path: site/package-lock.json

      # `working-directory` plutôt que `--prefix` : le lockfile et node_modules restent sous
      # site/, et le comportement ne dépend pas de la version de npm.
      - run: npm ci
        working-directory: site

      # Le même script qu'en local : copie des captures et de l'image de partage, build de la
      # documentation, montage de _site/, puis vérifications. Il sort en erreur si l'assemblage
      # est incomplet.
      - name: Assembler le site
        run: ./site/build-local.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Déployer sur GitHub Pages
    needs: build
    # Sur une pull request, on construit sans publier : une PR qui casse un lien devient rouge
    # sans pour autant pouvoir modifier le site en ligne.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    # Les permissions d'écriture sont portées par ce seul job, jamais par le workflow : le job
    # `build` tourne sur les PR de contributeurs extérieurs et n'a besoin que de lecture.
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
